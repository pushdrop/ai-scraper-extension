<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- DataPluck icon: a data grid with one row being "plucked" out -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a7fff"/>
      <stop offset="1" stop-color="#0052cc"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- static grid rows (the page's data) -->
  <g fill="#ffffff" fill-opacity="0.45">
    <rect x="28" y="34" width="48" height="13" rx="4"/>
    <rect x="80" y="34" width="20" height="13" rx="4"/>
    <rect x="28" y="90" width="48" height="13" rx="4"/>
    <rect x="80" y="90" width="20" height="13" rx="4"/>
  </g>

  <!-- the plucked row: lifted and fully white, casting a subtle shadow -->
  <g>
    <rect x="26" y="58" width="76" height="20" rx="6" fill="#003a99" fill-opacity="0.25" transform="translate(2 3)"/>
    <rect x="26" y="58" width="76" height="20" rx="6" fill="#ffffff"/>
    <rect x="32" y="64" width="40" height="8" rx="3" fill="#0052cc"/>
    <rect x="78" y="64" width="18" height="8" rx="3" fill="#1a7fff"/>
  </g>

  <!-- upward "pluck" arrow lifting the row out -->
  <path d="M64 30 L75 44 H67 V53 H61 V44 H53 Z" fill="#ffffff"/>
</svg>
